<script>
var places = [
  {lat:25.13953, lng:121.44095, name:"八里", desc:"2010~2026，我所生活的地方", link:"/2026/04/25/blog弄好了!/"},
  {lat:25.10469, lng:121.51653, name:"臺北市中正高中", desc:"我就讀的高中", link:"/"},
  {lat:24.97358, lng:121.56157, name:"臺北市東山中學", desc:"國中讀這裡", link:"/"},

  {lat:25.17071, lng:121.41638, name:"淡江大橋", desc:"跑步路過", link:"/2026/04/26/日常跑步訓練"},
  {lat:22.78742, lng:120.407, name:"高師大 燕巢校區", desc:"即將要來到這裡", link:"/"},
];

var map = L.map('map').setView([25.06, 121.54], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap © CARTO',
  maxZoom: 19
}).addTo(map);

var heatData = places.map(function(p){ return [p.lat, p.lng, 0.8]; });
L.heatLayer(heatData, {
  radius: 60,
  blur: 40,
  minOpacity: 0.5,
  gradient: {0.2:'#534AB7', 0.6:'#7F77DD', 1.0:'#c4bcf0'}
}).addTo(map);

var icon = L.divIcon({
  className:'',
  html:'<div style="width:12px;height:12px;background:#AFA9EC;border-radius:50%;border:2px solid #eae7f8;"></div>',
  iconSize:[12,12],
  iconAnchor:[6,6]
});


places.forEach(function(p){
  L.marker([p.lat,p.lng],{icon:icon}).addTo(map)
    .bindPopup('<b>'+p.name+'</b><p>'+p.desc+'</p><a href="'+p.link+'">閱讀心得 →</a>');
});
</script>

          light:'' ? '' : new URL('/css/giscus_reimu_light.css', window.location.origin).href
        }; 
        const hasGiscusCorsHeader = async (url) => {
          if (!url) return false;
          if (!url.startsWith('http')) return true; // not a url, maybe a name of built-in theme
          try {
            let response = await fetch(url, { method: 'HEAD', cache: 'no-store' });
            if (response.status === 405) {
              response = await fetch(url, { method: 'GET', cache: 'no-store' });
            }
            const allowOrigin = response.headers.get('access-control-allow-origin') || '';
            return allowOrigin === '*' || allowOrigin.split(',').map(value => value.trim()).includes('https://giscus.app');
          } catch {
            return false;
          }
        };
        let giscusTheme = defaultTheme;
        const [darkCorsOk, lightCorsOk] = await Promise.all([
          hasGiscusCorsHeader(customTheme.dark),

        ]);
        if (darkCorsOk && lightCorsOk) {
          giscusTheme = customTheme;
        }

        const docLang = document.documentElement.lang || 'en';
        const langBase = docLang.split('-')[0];
        const supportedLangs = ['ar', 'be', 'bg', 'ca', 'cs', 'da', 'de', 'en',

        const giscusLang = supportedLangs.includes(docLang) ? docLang : supportedLangs.includes(langBase) ? langBase : 'en';

    // 2. 如果localStorage中有值且对应的评论系统可用，就使用它
    if (savedCommentType) {
      if (commentConfig[savedCommentType]?.enable) {
        defaultComment = savedCommentType;
      }
    }
    
    // 3. 如果localStorage无效，检查配置的默认评论系统
    if (!defaultComment) {
      var configDefault = 'waline';
      if (commentConfig[configDefault]?.enable) {
        defaultComment = configDefault;
      }
    }
    
    // 4. 如果前两项都无效，按指定顺序找到第一个可用的评论系统
    if (!defaultComment) {
      defaultComment = commentConfigKeys.find(sys => commentConfig[sys].enable) || '';
    }
  }
  function loadComments() {
    if (!commentConfig.enable) return;
    const loadedComments = {
      valine: false,
      waline: false,
      twikoo: false,
      gitalk: false,
      giscus: false,
      utterances: false,
      beaudar: false,
      disqus: false,
    };

    // 隐藏所有评论容器
    const hideAllComments = () => {
      const commentContainers = document.querySelectorAll('.comment');
      commentContainers.forEach(container => {
        container.style.display = 'none';
      });
    };

    // 按需加载评论系统
    const loadCommentSystem = (type) => {
      if (loadedComments[type]) {
        // 如果已加载，只需显示对应容器
        document.querySelector(`.${type}-comment`).style.display = 'block';
        return;
      }

      // 根据类型加载对应的脚本
      commentConfig[type]?.load();
      loadedComments[type] = true;
    };

    // 评论组件选择器
    const changeActiveCommentItems = (item) => {
      const commentItems = document.querySelectorAll('.selector-item');
      for (let i = 0; i < commentItems.length; i++) {
        commentItems[i].classList.remove('active');
      }
      item.classList.add('active');

      // 获取要加载的评论系统类型
      const commentType = item.getAttribute('data-selector');

      // 隐藏所有评论系统
      hideAllComments();

      // 加载选中的评论系统
      loadCommentSystem(commentType);
    };

    const commentInit = () => {
      // 评论组件选择器点击事件
      const commentItems = document.querySelectorAll('.selector-item');
      for (let item of commentItems) {
        item.addEventListener('click', () => {
          // 保存选择器状态
          const commentType = item.getAttribute('data-selector');
          window.localStorage.setItem('commentType', commentType);
          // 切换选中状态
          changeActiveCommentItems(item);
        });
      }

      // 检查是否需要加载默认评论系统
      if (defaultComment) {
        const defaultSelectorItem = document.querySelector(`[data-selector="${defaultComment}"]`);
        if (!defaultSelectorItem) return;
        defaultSelectorItem.style.display = 'block';
        defaultSelectorItem.classList.add('active');
        loadCommentSystem(defaultComment);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', commentInit);
    } else {
      commentInit();
    }
  };
  loadComments();
